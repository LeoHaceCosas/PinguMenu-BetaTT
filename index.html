<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinguMenú | Gourmet 🐧</title>
    
    <!-- Scripts Externos -->
    <script src="https://google.com" async defer></script>
    <script src="https://jsdelivr.net"></script>
    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        :root { 
            --primary: #48cae4; 
            --secondary: #0077b6; 
            --accent: #ff4d6d; 
            --bg: #caf0f8; 
            --glass: rgba(255, 255, 255, 0.85); 
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #caf0f8 0%, #90e0ef 100%); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #023e8a; 
        }

        .container { 
            background: var(--glass); 
            backdrop-filter: blur(10px); 
            border-radius: 24px; 
            padding: 30px; 
            width: 90%; 
            max-width: 850px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            border: 1px solid rgba(255,255,255,0.3); 
            animation: fadeIn 0.5s ease-out; 
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }
        h1, h2, h3 { text-align: center; margin-top: 0; }

        /* Login */
        .login-card { text-align: center; padding: 50px 20px; }
        input[type="text"] { padding: 12px; width: 250px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--secondary); box-shadow: 0 0 8px rgba(0,119,182,0.2); }

        /* Tienda */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 18px; text-align: center; transition: 0.3s; border: 1px solid transparent; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
        .price { font-size: 1.25rem; font-weight: 600; color: var(--secondary); margin: 5px 0; }
        
        /* Controles */
        .payment-box { margin: 20px 0; text-align: center; background: rgba(255,255,255,0.4); padding: 15px; border-radius: 15px; }
        select { padding: 8px; border-radius: 8px; border: 1px solid var(--secondary); background: white; cursor: pointer; font-family: inherit; }

        button { cursor: pointer; background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; transition: 0.2s; }
        button:hover { filter: brightness(1.1); transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        button:disabled { background: #adb5bd; transform: none; cursor: not-allowed; }
        
        .btn-logout { background: transparent; color: #666; font-size: 0.75rem; padding: 5px 10px; border: 1px solid #ccc; }
        .btn-clear { background: var(--accent); margin-top: 15px; font-size: 0.8rem; }

        /* Historial */
        .history-section { margin-top: 30px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 20px; }
        .history-list { max-height: 180px; overflow-y: auto; background: rgba(255,255,255,0.5); border-radius: 12px; padding: 10px; }
        .history-item { font-size: 0.8rem; border-bottom: 1px solid rgba(0,0,0,0.05); padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .tag-pago { font-size: 0.65rem; background: #e0f2fe; padding: 2px 8px; border-radius: 20px; color: #0369a1; font-weight: bold; margin-left: 8px; }
    </style>
</head>
<body>

<!-- Pantalla de Login -->
<div id="login-box" class="container login-card">
    <h1>🐧 PinguMenú</h1>
    <div id="g_id_onload" data-client_id="TU_ID_GOOGLE" data-callback="handleGoogle"></div>
    <div class="g_id_signin" data-type="standard" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
    <p style="font-size: 0.8rem; color: #666;">— o usa tu nombre —</p>
    <input type="text" id="user-input" placeholder="Nombre de usuario">
    <br>
    <button onclick="checkAccess()">Entrar al Menú</button>
</div>

<!-- Pantalla Principal -->
<div id="app" class="container hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 id="welcome-user" style="margin:0; font-size: 1.2rem;">Hola</h2>
        <button class="btn-logout" onclick="logout()">Salir</button>
    </div>

    <div class="payment-box">
        <label style="font-weight: 600;">Método de Pago: </label>
        <select id="payment-method">
            <option value="Efectivo">💵 Efectivo</option>
            <option value="PinguCard Deud">💳 PinguCard Deud</option>
        </select>
    </div>

    <div class="product-grid" id="menu-container"></div>

    <div class="history-section">
        <h3>Recibos Recientes</h3>
        <div id="history-list" class="history-list"></div>
        <center><button class="btn-clear" onclick="clearHistory()">Limpiar Historial</button></center>
    </div>
</div>

<script>
    // --- CONFIGURACIÓN EMAILJS ---
    const EMAILJS_PUBLIC_KEY = "TU_PUBLIC_KEY";
    const EMAILJS_SERVICE_ID = "TU_SERVICE_ID";
    const EMAILJS_TEMPLATE_ID = "TU_TEMPLATE_ID";

    emailjs.init(EMAILJS_PUBLIC_KEY);

    const defaultItems = [
        { id: 1, name: "Sandwiché", price: 45, stock: 10, icon: "🥪" },
        { id: 2, name: "Salchichas Catsup", price: 30, stock: 15, icon: "🌭" },
        { id: 3, name: "Huevito", price: 25, stock: 8, icon: "🍳" },
        { id: 4, name: "Pequesadilla", price: 35, stock: 12, icon: "🌮" }
    ];

    let products = JSON.parse(localStorage.getItem('pm_stock')) || defaultItems;
    let history = JSON.parse(localStorage.getItem('pm_history')) || [];
    let currentUser = localStorage.getItem('pm_session');

    window.onload = () => { if (currentUser) startApp(currentUser); };

    function checkAccess() {
        const val = document.getElementById('user-input').value.trim();
        if (val.toLowerCase() === 'reset') {
            localStorage.clear();
            alert("Sistema reseteado correctamente.");
            location.reload();
        } else if (val.length >= 2) {
            localStorage.setItem('pm_session', val);
            startApp(val);
        }
    }

    function handleGoogle(response) {
        localStorage.setItem('pm_session', "Usuario Google");
        startApp("Usuario Google");
    }

    function startApp(name) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('welcome-user').innerText = `¡Hola, ${name}! 🐧`;
        render();
    }

    function logout() {
        localStorage.removeItem('pm_session');
        location.reload();
    }

    function buy(id) {
        const p = products.find(x => x.id === id);
        const method = document.getElementById('payment-method').value;
        const userName = localStorage.getItem('pm_session');

        if (p.stock > 0) {
            p.stock--;
            const order = {
                item: p.name,
                price: p.price,
                method: method,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };
            
            history.push(order);
            save();
            render();
            sendEmail(userName, order);
        }
    }

    function sendEmail(user, order) {
        const params = {
            user_name: user,
            order_details: order.item,
            total_price: `$${order.price}`,
            payment_method: order.method
        };

        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
            .then(() => console.log("Email enviado"))
            .catch(err => console.error("Error EmailJS:", err));
    }

    function render() {
        document.getElementById('menu-container').innerHTML = products.map(p => `
            <div class="card">
                <div style="font-size: 2.5rem; margin-bottom:10px;">${p.icon}</div>
                <h4 style="margin:5px 0;">${p.name}</h4>
                <div class="price">$${p.price}</div>
                <div style="font-size:0.7rem; color:#666; margin-bottom:12px;">Stock: ${p.stock}</div>
                <button onclick="buy(${p.id})" ${p.stock === 0 ? 'disabled' : ''}>
                    ${p.stock > 0 ? 'Comprar' : 'Agotado'}
                </button>
            </div>
        `).join('');

        const hList = document.getElementById('history-list');
        hList.innerHTML = history.length ? 
            history.map(h => `
                <div class="history-item">
                    <span><b>${h.item}</b> <span class="tag-pago">${h.method}</span></span>
                    <span>$${h.price} <small style="color:#999; margin-left:5px;">${h.time}</small></span>
                </div>
            `).reverse().join('') : '<p style="text-align:center; color:#999; font-size:0.8rem;">No hay pedidos aún.</p>';
    }

    function clearHistory() {
        if(confirm("¿Seguro que quieres borrar el historial?")) {
            history = [];
            save();
            render();
        }
    }

    function save() {
        localStorage.setItem('pm_stock', JSON.stringify(products));
        localStorage.setItem('pm_history', JSON.stringify(history));
    }
</script>
</body>
  </html>
